name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC (7:00 AM hora Colombia)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan SUPABASE_URL / SUPABASE_ANON_KEY en GitHub Actions Secrets."
            exit 1
          fi

          # Limpiar posibles espacios/saltos de línea al pegar secretos y barra final en la URL
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X GET "$URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          echo "HTTP status: $HTTP_CODE"
          cat "$RESPONSE_FILE"
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::El ping a Supabase falló (HTTP $HTTP_CODE). Si el cuerpo dice 'permission denied for table categories' (42501), falta ejecutar supabase/migration_01_conexion_frontend.sql en el SQL Editor de Supabase para otorgar permisos (GRANT) al rol anon."
            exit 1
          fi

          echo "Supabase pinged successfully. Project will not be paused!"
