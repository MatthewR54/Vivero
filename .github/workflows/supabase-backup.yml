name: Supabase Backup

on:
  schedule:
    # Se ejecuta todos los días a las 08:17 UTC (3:17 AM hora Colombia)
    - cron: '17 8 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub
  push: # TEMPORAL: prueba de secrets antes de fusionar a main
    branches: [feature/respaldo-diario]

# Dos respaldos no deben correr al mismo tiempo
concurrency:
  group: supabase-backup
  cancel-in-progress: false

env:
  # Versión mayor de pg_dump: debe ser igual o mayor a la versión de Postgres
  # del proyecto en Supabase (Project Settings → Infrastructure).
  PG_MAJOR: '17'
  # Días que GitHub guarda cada respaldo (máximo 90 en repositorios públicos)
  RETENTION_DAYS: 30

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verificar secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FALTAN=0
          for NOMBRE in SUPABASE_DB_URL BACKUP_PASSPHRASE; do
            if [ -z "${!NOMBRE}" ]; then
              echo "::error::Falta el secret $NOMBRE (ver docs/respaldos_base_datos.md)"
              FALTAN=1
            else
              echo "$NOMBRE: configurado"
            fi
          done
          case "$SUPABASE_DB_URL" in
            ''|postgresql://*|postgres://*) ;;
            *) echo "::error::SUPABASE_DB_URL debe empezar por postgresql://"; FALTAN=1 ;;
          esac
          case "$SUPABASE_DB_URL" in
            *YOUR-PASSWORD*) echo "::error::SUPABASE_DB_URL aún tiene [YOUR-PASSWORD]; reemplázalo por la contraseña de la base"; FALTAN=1 ;;
          esac
          # Una contraseña con @ : / ? # [ ] rompe la URL; debe tener solo letras y números
          CREDENCIALES="${SUPABASE_DB_URL#*://}"; CREDENCIALES="${CREDENCIALES%@*}"
          CLAVE="${CREDENCIALES#*:}"
          case "$CLAVE" in
            *[@:/?#\[\]]*) echo "::error::La contraseña dentro de SUPABASE_DB_URL tiene símbolos (@ : / ? # [ ]) que rompen la dirección; cámbiala en Supabase por una de solo letras y números"; FALTAN=1 ;;
          esac
          exit $FALTAN

      - name: Generar respaldo (pg_dump)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(TZ=America/Bogota date +%Y-%m-%d_%H%M)
          echo "BACKUP_NAME=vivero_respaldo_${STAMP}" >> "$GITHUB_ENV"

          # Solo el esquema public (tablas, datos, funciones, políticas RLS y permisos).
          # Los esquemas internos de Supabase (auth, storage, etc.) los administra Supabase.
          docker pull -q postgres:${PG_MAJOR}-alpine > /dev/null
          if ! docker run --rm -e SUPABASE_DB_URL postgres:${PG_MAJOR}-alpine \
            sh -c 'pg_dump --dbname="$SUPABASE_DB_URL" --schema=public --no-owner --quote-all-identifiers' \
            > respaldo.sql 2> pg_dump.err; then
            # Mostrar el error de pg_dump como anotación. El repo es público:
            # se ocultan las URLs, lo que va entre comillas y cualquier texto con @
            # (pueden contener partes de la contraseña).
            sed -E -e 's#postgres(ql)?://[^ ]*#[oculto]#g' -e 's#"[^"]*"#"[oculto]"#g' -e 's#[^ ]*@[^ ]*#[oculto]#g' \
              pg_dump.err | tail -n 3 | while IFS= read -r LINEA; do
              echo "::error::pg_dump: $LINEA"
            done
            exit 1
          fi

          # Un dump incompleto no termina con esta línea
          if ! tail -n 5 respaldo.sql | grep -q 'PostgreSQL database dump complete'; then
            echo "::error::El respaldo quedó incompleto"
            exit 1
          fi
          echo "Tablas respaldadas: $(grep -c '^COPY ' respaldo.sql)"
          echo "Tamaño: $(du -h respaldo.sql | cut -f1)"

      - name: Comprimir y cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # El repositorio es público: el respaldo contiene datos de clientes,
          # así que se cifra antes de subirlo como artifact.
          gzip -9 respaldo.sql
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
            --symmetric --cipher-algo AES256 \
            --output "${BACKUP_NAME}.sql.gz.gpg" respaldo.sql.gz
          rm respaldo.sql.gz

      - name: Guardar respaldo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.sql.gz.gpg
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 0
